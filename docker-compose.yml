# Todo el proyecto con un comando: el kit (Redpanda, Console, simulador) + Postgres + API + consumidor.
#
#   docker compose up -d --build
#
# Si el kit ya está corriendo por separado (cd kit && docker compose up), apágalo antes:
# comparten puertos (19092, 8080, 8090).
#
# El schema (db/schema.sql) solo se carga cuando el volumen de Postgres está vacío.
# Si lo cambias:  docker compose down -v   y vuelve a levantar.

include:
  - kit/docker-compose.yml

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inv
      POSTGRES_PASSWORD: inv
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "inv", "-d", "inventory"]
      interval: 3s
      timeout: 5s
      retries: 20

  # API HTTP (puerto 8000) y pantallas en /ui. No lee Redpanda: consulta y opera sobre Postgres.
  # La imagen se construye desde la raíz porque también compila frontend/.
  backend:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    image: inventory-backend
    environment:
      DATABASE_URL: postgresql://inv:inv@postgres:5432/inventory
      CORS_ORIGINS: "*"   # el frontend en desarrollo (Vite) vive en otro origen
      # Asesor (opcional): la key se lee del .env de la raíz, que git ignora. Sin key, /advisor responde 503.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # La misma API y pantallas por HTTPS (certificado autofirmado de la imagen), para el celular:
  # la cámara solo abre en HTTPS. Abrir https://<ip-de-la-pc>:8443/ui/ y aceptar el aviso una vez.
  # Las pruebas de contrato siguen usando el :8000 en HTTP.
  backend-https:
    build: *backend-build
    image: inventory-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8443",
              "--ssl-keyfile", "/certs/key.pem", "--ssl-certfile", "/certs/cert.pem"]
    environment:
      DATABASE_URL: postgresql://inv:inv@postgres:5432/inventory
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "8443:8443"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Consumidor: lee los tópicos del taller, actualiza Postgres y publica los stock.* en inventory.events.
  # La API necesita que esté corriendo (el publicador de avisos vive aquí). Debe haber UNO solo.
  # Si la base está vacía (primer arranque o reconstrucción) relee todo desde el inicio, catálogo primero.
  consumer:
    build: *backend-build
    image: inventory-backend
    command: ["python", "-m", "app.consumer"]
    environment:
      DATABASE_URL: postgresql://inv:inv@postgres:5432/inventory
      KAFKA_BROKERS: redpanda:9092
      KAFKA_GROUP_ID: inventory-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  pgdata:
